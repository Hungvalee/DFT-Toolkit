[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dft-toolkit"
version = "0.2.0"
description = "Python toolkit for VASP electronic structure analysis"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

authors = [
    { name = "Le Van Hung" }
]

keywords = [
    "vasp",
    "dft",
    "density-functional-theory",
    "materials-science",
    "electronic-structure",
    "band-structure",
    "dos"
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Chemistry"
]

dependencies = [
    "numpy>=1.23",
    "matplotlib>=3.7"
]

[project.urls]
Homepage = "https://github.com/Hungvalee/DFT-Toolkit"
Repository = "https://github.com/Hungvalee/DFT-Toolkit"
Issues = "https://github.com/Hungvalee/DFT-Toolkit/issues"

[project.scripts]
dft-toolkit = "dft_toolkit.cli.main:main"

[tool.setuptools.packages.find]
include = ["dft_toolkit*"]
